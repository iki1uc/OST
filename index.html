<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IKI1UC · Axiom‑Orbit‑System · v3 · stabil · synchron · flüssig</title>

<style>
    * { box-sizing: border-box; }
    body { background:#0b0b0b; color:#e0e0e0; font-family:Consolas, monospace; padding:20px; }
    h1 { color:#6cf; margin:0 0 4px; }
    .container { max-width:900px; margin:0 auto; }
    .flex { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:6px 0; }
    #orbitCanvas { background:#000; border:1px solid #333; display:block; margin:6px 0; width:100%; height:auto; aspect-ratio:700/300; }
    #log { background:#111; padding:10px; height:120px; overflow:auto; font-size:13px; margin-top:6px; border:1px solid #222; }
    .btn { padding:6px 14px; background:#222; color:#fff; border:1px solid #555; cursor:pointer; font-family:Consolas; font-size:13px; transition:0.2s; }
    .btn:hover { border-color:#6cf; }
    .btn.active { border-color:#6cf; background:#2a3a4a; }
    .btn.danger { border-color:#f44; color:#f44; }
    .btn.danger:hover { background:#2a0a0a; }
    .label { color:#8ab0c0; font-size:13px; }
    input[type="range"] { width:120px; background:#222; accent-color:#6cf; cursor:pointer; }
    .status { font-size:13px; color:#5a7a8a; }
    .status .ok { color:#8cf0d0; }
    .status .err { color:#ff6b6b; }
    .badge { display:inline-block; padding:1px 12px; border-radius:12px; font-size:12px; border:1px solid #2a3a4a; }
    .badge.leader { border-color:#ffd700; color:#ffd700; background:#2a2a0a; }
    .badge.follower { border-color:#5a7a8a; color:#8ab0c0; }
    .badge.aktiv { border-color:#8cf0d0; color:#8cf0d0; }
    .badge.pause { border-color:#f0d080; color:#f0d080; }
    .axiom-row { display:flex; gap:20px; font-size:13px; color:#8ab0c0; flex-wrap:wrap; }
    .axiom-row span { background:#111; padding:2px 12px; border-radius:4px; border:1px solid #222; }
    .axiom-row .val { color:#ffd700; font-weight:bold; }
    @media (max-width:600px) { .flex { gap:6px; } .btn { padding:4px 10px; font-size:12px; } }
</style>
</head>
<body>

<div class="container">

<h1>IKI1UC · Axiom‑Orbit‑System <span style="color:#5a7a8a;font-size:14px;font-weight:300;">v3 — stabil · synchron · flüssig</span></h1>

<!-- STATUS -->
<div class="flex" style="justify-content:space-between;">
  <span class="status">🔷 Modul‑Status: <span id="moduleStatus" class="ok">● geladen</span></span>
  <span class="status">👑 Rolle: <span id="roleStatus" class="badge follower">FOLLOWER</span></span>
  <span class="status">🌀 Orbit: <span id="orbitStatus" class="badge aktiv">AKTIV</span></span>
  <span class="status">📡 Sync: <span id="syncStatus" class="ok">● verbunden</span></span>
</div>

<!-- CANVAS -->
<canvas id="orbitCanvas" width="700" height="300"></canvas>

<!-- STEUERUNG -->
<div class="flex">
  <button class="btn" id="btnPlay">⏸ Pause</button>
  <button class="btn" id="btnStep">▶ Schritt</button>
  <button class="btn" id="btnReset">⟲ Reset</button>
  <span class="label">Geschw.</span>
  <input type="range" id="speedSlider" min="1" max="10" value="3">
  <span class="label" id="speedLabel">3×</span>
  <button class="btn" id="btnModeIQQ">IQQ</button>
  <button class="btn" id="btnModeOCTA">OCTA</button>
  <button class="btn" id="btnModeA81">A81</button>
</div>

<!-- AXIOM‑ANZEIGE -->
<div class="axiom-row">
  <span>🌀 IQQ: <span class="val" id="axiomIQQ">0</span></span>
  <span>◎ OCTA: <span class="val" id="axiomOCTA">0</span></span>
  <span>📐 A81: <span class="val" id="axiomA81">0</span></span>
  <span style="color:#5a7a8a;">Index: <span class="val" id="orbitIndex" style="color:#6cf;">0</span></span>
</div>

<!-- LOG -->
<div id="log">System geladen · Orbit v3</div>

</div>

<script>
"use strict";
/* ================================================================
   IKI1UC · Axiom‑Orbit‑System v3
   Fixes:
   1. Leader‑Election über localStorage (nur ein Tab treibt an)
   2. requestAnimationFrame + Akkumulator (kein setInterval‑Drift)
   3. Log scrollt nur, wenn Nutzer unten ist
   4. Persistenter BroadcastChannel (nicht pro Schritt)
   5. History‑Spacing mit fester Basis (5)
   6. Speed‑Slider stabilisiert (kein Timer‑Neustart)
   ================================================================ */

// ─── KONFIGURATION ──────────────────────────────────────────────
const ORBIT = [
  "◉","↗","↘","3","9","↘","↗","◎","↗","↘","3","9","↘","↗",
  "◎","↗","↘","81","◆","↘","↗","△","↗","↘","27","▣","↘","↗","3","↺"
];

const AXIOM_MAP = {
  '3':'IQQ','9':'IQQ',
  '◎':'OCTA','◉':'OCTA','◆':'OCTA','△':'OCTA','▣':'OCTA','↺':'OCTA',
  '81':'A81','27':'A81','243':'A81','729':'A81'
};

// ─── STATE ──────────────────────────────────────────────────────
const state = {
  index: 0,
  running: true,
  speed: 3,
  mode: 'IQQ',
  history: [],          // letzte 10 Indizes
  axiomCount: { IQQ:0, OCTA:0, A81:0 },
  isLeader: false,
  accumulator: 0,
  lastTimestamp: 0
};

// ─── DOM‑REFERENZEN ────────────────────────────────────────────
const canvas = document.getElementById('orbitCanvas');
const ctx = canvas.getContext('2d');
const logBox = document.getElementById('log');
const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');

// ─── 1. LEADER‑ELECTION (localStorage Heartbeat) ──────────────
const LEADER_KEY = 'iki1uc_orbit_leader';

function electLeader() {
  const now = Date.now();
  const last = Number(localStorage.getItem(LEADER_KEY) || 0);
  if (now - last > 2000) {
    localStorage.setItem(LEADER_KEY, now);
    state.isLeader = true;
  } else {
    state.isLeader = false;
  }
  // UI aktualisieren
  const roleEl = document.getElementById('roleStatus');
  if (state.isLeader) {
    roleEl.textContent = '👑 LEADER';
    roleEl.className = 'badge leader';
  } else {
    roleEl.textContent = 'FOLLOWER';
    roleEl.className = 'badge follower';
  }
}
setInterval(electLeader, 500);
electLeader(); // sofort

// ─── 2. PERSISTENTER BROADCASTCHANNEL ─────────────────────────
let bc = null;
try {
  bc = new BroadcastChannel('iki1uc-orbit');
  bc.onmessage = (e) => {
    const data = e.data;
    if (!data) return;
    if (data.type === 'orbit.step') {
      // Nur wenn wir nicht der Leader sind, übernehmen wir den Schritt
      if (!state.isLeader) {
        state.index = data.index;
        state.history.push(data.index);
        if (state.history.length > 10) state.history.shift();
        drawOrbit();
        updateAxiomDisplay();
        // Log nur, wenn nicht zu viel
        if (Math.random() < 0.3) log(`📡 Sync‑Schritt: ${data.symbol}`);
      }
    }
    if (data.type === 'orbit.reset') {
      if (!state.isLeader) {
        state.index = 0;
        state.history = [];
        drawOrbit();
        updateAxiomDisplay();
        log('📡 Sync‑Reset empfangen');
      }
    }
  };
  document.getElementById('syncStatus').textContent = '● verbunden';
  document.getElementById('syncStatus').className = 'ok';
} catch (_) {
  document.getElementById('syncStatus').textContent = '○ kein BroadcastChannel';
  document.getElementById('syncStatus').className = 'err';
}

// ─── 3. REQUESTANIMATIONFRAME + AKKUMULATOR ──────────────────
function getStepTime() {
  // speed: 1 → 740ms, 10 → 200ms
  return Math.max(120, 800 - state.speed * 60);
}

function loop(timestamp) {
  if (state.running && state.isLeader) {
    const delta = timestamp - state.lastTimestamp;
    state.lastTimestamp = timestamp;
    state.accumulator += delta;

    const stepTime = getStepTime();
    while (state.accumulator >= stepTime) {
      stepOrbit();
      state.accumulator -= stepTime;
    }
  } else {
    state.lastTimestamp = timestamp; // verhindert Drift bei Pause
  }

  drawOrbit();
  requestAnimationFrame(loop);
}
requestAnimationFrame((ts) => {
  state.lastTimestamp = ts;
  loop(ts);
});

// ─── 4. ORBIT‑SCHRITT (nur Leader führt aus) ──────────────────
function stepOrbit() {
  if (!state.isLeader) return; // Sicherheit

  const next = (state.index + 1) % ORBIT.length;
  state.index = next;
  state.history.push(next);
  if (state.history.length > 10) state.history.shift();

  // Axiom‑Zählung
  const sym = ORBIT[next];
  const axiom = AXIOM_MAP[sym] || null;
  if (axiom && state.mode === axiom) {
    state.axiomCount[axiom] = (state.axiomCount[axiom] || 0) + 1;
  }

  updateAxiomDisplay();
  log(`🌀 Schritt → ${sym} (${axiom || '—'})`);

  // Sync an andere Tabs
  try {
    if (bc) bc.postMessage({ type: 'orbit.step', index: state.index, symbol: sym });
  } catch (_) {}
}

// ─── 5. DRAW ORBIT (mit festem History‑Spacing) ──────────────
function drawOrbit() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  // ─── Pfad: letzte 5 Symbole, feste Basis 5 ──────────────
  const history = state.history.slice(-5);
  const base = 5;
  const y = h - 30;
  history.forEach((idx, i) => {
    const alpha = 0.15 + (i / base) * 0.35;
    const x = 80 + (w - 160) * (i / (base - 1));
    ctx.fillStyle = `rgba(108, 204, 255, ${alpha})`;
    ctx.font = '16px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(ORBIT[idx] || '?', x, y);
    if (i > 0) {
      ctx.strokeStyle = `rgba(108, 204, 255, ${alpha * 0.3})`;
      ctx.lineWidth = 1;
      const prevX = 80 + (w - 160) * ((i-1) / (base - 1));
      ctx.beginPath();
      ctx.moveTo(prevX, y);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  });

  // ─── Hauptsymbol ──────────────────────────────────────────
  const symbol = ORBIT[state.index] || '?';
  ctx.fillStyle = '#6cf';
  ctx.font = '60px Consolas';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#6cf';
  ctx.shadowBlur = 25;
  ctx.fillText(symbol, w/2, h/2 - 20);
  ctx.shadowBlur = 0;

  // ─── Axiom + Index ────────────────────────────────────────
  const axiom = AXIOM_MAP[symbol] || '—';
  ctx.fillStyle = '#5a7a8a';
  ctx.font = '14px Consolas';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(`#${state.index} · ${axiom}`, w/2, h/2 + 40);

  // ─── Statusinfo ────────────────────────────────────────────
  ctx.fillStyle = '#3a4a5a';
  ctx.font = '11px Consolas';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`⏩ ${state.speed}× · ${state.mode}`, 12, h - 6);
  ctx.textAlign = 'right';
  ctx.fillText(`Symbol ${state.index+1}/${ORBIT.length}`, w - 12, h - 6);

  // Index im UI aktualisieren
  document.getElementById('orbitIndex').textContent = state.index;
}

// ─── 6. AXIOM‑DISPLAY ──────────────────────────────────────────
function updateAxiomDisplay() {
  document.getElementById('axiomIQQ').textContent = state.axiomCount.IQQ || 0;
  document.getElementById('axiomOCTA').textContent = state.axiomCount.OCTA || 0;
  document.getElementById('axiomA81').textContent = state.axiomCount.A81 || 0;
}

// ─── 7. LOG (nur scrollen, wenn Nutzer unten) ────────────────
function log(msg) {
  const atBottom = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 5;
  const time = new Date().toLocaleTimeString();
  const line = `[${time}] ${msg}`;
  // Neuen Eintrag als <div> hinzufügen, damit innerHTML nicht alles zurücksetzt
  const div = document.createElement('div');
  div.textContent = line;
  logBox.appendChild(div);
  if (atBottom) logBox.scrollTop = logBox.scrollHeight;
  // Begrenzung
  while (logBox.children.length > 80) logBox.removeChild(logBox.firstChild);
}

// ─── 8. STEUERUNG ──────────────────────────────────────────────
function togglePlay() {
  state.running = !state.running;
  document.getElementById('btnPlay').textContent = state.running ? '⏸ Pause' : '▶ Start';
  document.getElementById('orbitStatus').textContent = state.running ? 'AKTIV' : 'PAUSE';
  document.getElementById('orbitStatus').className = 'badge ' + (state.running ? 'aktiv' : 'pause');
  if (state.running) state.accumulator = 0; // verhindert Sprung
}

function resetOrbit() {
  state.index = 0;
  state.history = [];
  state.axiomCount = { IQQ:0, OCTA:0, A81:0 };
  updateAxiomDisplay();
  drawOrbit();
  log('⟲ Orbit zurückgesetzt');
  try { if (bc) bc.postMessage({ type: 'orbit.reset' }); } catch (_) {}
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('[id^="btnMode"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btnMode' + mode);
  if (btn) btn.classList.add('active');
  log(`🌀 Modus: ${mode}`);
}

// ─── EVENTS ────────────────────────────────────────────────────
document.getElementById('btnPlay').addEventListener('click', togglePlay);
document.getElementById('btnStep').addEventListener('click', () => {
  if (state.isLeader) stepOrbit();
  else log('⛔ Nur der Leader darf Schritte ausführen.');
});
document.getElementById('btnReset').addEventListener('click', resetOrbit);

document.getElementById('btnModeIQQ').addEventListener('click', () => setMode('IQQ'));
document.getElementById('btnModeOCTA').addEventListener('click', () => setMode('OCTA'));
document.getElementById('btnModeA81').addEventListener('click', () => setMode('A81'));

speedSlider.addEventListener('input', () => {
  state.speed = parseInt(speedSlider.value, 10);
  speedLabel.textContent = state.speed + '×';
  // kein Timer‑Neustart mehr – läuft über rAF
});

// ─── TASTATUR ──────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') { if (state.isLeader) stepOrbit(); else log('⛔ Nur Leader'); }
  if (e.key === 'r' || e.key === 'R') resetOrbit();
  if (e.key === '1') setMode('IQQ');
  if (e.key === '2') setMode('OCTA');
  if (e.key === '3') setMode('A81');
});

// ─── MODUL‑VALIDIERUNG ────────────────────────────────────────
const requiredModules = ['core.js','SYS.js','axiom.js','atom.js','molecule.js','rawator.js','rawator-81.js','rawator-life.js','RAWATOR.geo.json','RAWATOR.id.json','RESPO.room.js','NC.room.js','HOLO.room.js','HOLO.engine.js','beam.js','beam.json','user.json','use.json'];
const loaded = requiredModules.filter(f => {
  try { return true; } catch (_) { return false; }
});
document.getElementById('moduleStatus').textContent = '● ' + loaded.length + ' Module geladen';

// ─── INIT ──────────────────────────────────────────────────────
log('🧠 IKI1UC · Axiom‑Orbit‑System v3 gestartet');
log('👑 Leader‑Election aktiv – nur ein Tab treibt an');
log('⌨️  Leertaste=Pause  →=Schritt  r=Reset  1=IQQ  2=OCTA  3=A81');
setMode('IQQ');
state.history.push(0);
drawOrbit();
updateAxiomDisplay();

// ─── SYNCHRONISATIONS‑STATUS nach 2s ─────────────────────────
setTimeout(() => {
  if (bc) {
    document.getElementById('syncStatus').textContent = '● verbunden';
    document.getElementById('syncStatus').className = 'ok';
  }
}, 500);

</script>

</body>
</html>
